# =============================================================================
# Yazi 插件包管理配置文件
# =============================================================================
# 作者: Hao Feng (F1)
# 文档: https://yazi-rs.github.io/docs/plugins/overview
# =============================================================================
# 版本历史:
#   v1.0.0 - 2025-01-15 - 初始配置
--   v1.1.0 - 2025-02-20 - 添加 recycle-bin 和 restore 插件
# =============================================================================

# -----------------------------------------------------------------------------
# [[plugin.deps]] - 插件依赖声明
# -----------------------------------------------------------------------------
# 每个插件需要指定:
#   use  - GitHub 仓库路径 (用户名/仓库名)
#   rev  - Git commit hash 或 tag（固定版本）
#   hash - 用于验证完整性的 SHA256 哈希
#
# 安装新插件:
#   1. 在此文件添加插件声明
#   2. 运行 `ya pack -i` 自动下载安装
# -----------------------------------------------------------------------------

# ────────────────────────────────────────────────────────────────────────────
# recycle-bin - 回收站插件
# ────────────────────────────────────────────────────────────────────────────
# 仓库: https://github.com/uhs-robert/yazi-recycle-bin
# 功能: 提供类似 macOS 回收站的功能，支持恢复被删除的文件
[[plugin.deps]]
use = "uhs-robert/recycle-bin"
rev = "fa68711"
hash = "8714306b5cac6359edbacbf545fbd691"

# ────────────────────────────────────────────────────────────────────────────
# restore - 恢复插件
# ────────────────────────────────────────────────────────────────────────────
# 仓库: https://github.com/boydaihungst/yazi-restore
# 功能: 增强的恢复功能，支持从回收站恢复文件
[[plugin.deps]]
use = "boydaihungst/restore"
rev = "4eda0bf"
hash = "778941e7f1ebbacd60f4e254bb3c51de"

# -----------------------------------------------------------------------------
# [flavor] - 主题/配色方案
# -----------------------------------------------------------------------------
# 主题插件管理，类似于 IDE 的主题系统
# 官方主题列表: https://github.com/yazi-rs/flavors
[flavor]
deps = []  # 当前未启用任何主题，使用默认配色
