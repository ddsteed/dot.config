[manager]
show_hidden = true
sort_by = "mtime"
sort_reverse = true
linemode = "mtime"
ratio = [1, 3, 4]

[preview]
wrap            = "no"
tab_size        = 2
max_width       = 1200
max_height      = 1800
cache_dir       = ""
image_delay     = 10
image_filter    = "triangle"
image_quality   = 90
ueberzug_scale  = 1
ueberzug_offset = [0, 0, 0, 0]

[tasks]
micro_workers    = 10
macro_workers    = 10
bizarre_retry    = 3
image_alloc      = 0
image_bound      = [0, 0]
suppress_preload = false

[opener]
edit = [
  { run = "nvim \"$@\"", desc = "Neovim" },
]
open = [
  { run = "open \"$@\"", desc = "macOS Open" },
]

[plugin]
prepend_previewers = [
  { mime = "image/hei?", run = "heic-ql" },
]

prepend_preloaders = [
  { mime = "image/hei?", run = "heic-ql" },
]

