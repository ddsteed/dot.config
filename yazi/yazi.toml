# =============================================================================
# Yazi 主配置文件
# =============================================================================
# 作者: Hao Feng (F1)
# 项目: https://github.com/sxyazi/yazi
# =============================================================================
# 版本历史:
#   v1.0.0 - 2025-01-15 - 初始配置，基础文件管理器设置
#   v1.1.0 - 2025-02-20 - 添加 HEIC 图片预览支持
#   v1.2.0 - 2025-03-10 - 配置 iWork 文件使用系统默认打开
# =============================================================================

# -----------------------------------------------------------------------------
# [manager] - 文件管理器行为设置
# -----------------------------------------------------------------------------
# 控制文件列表的显示方式、排序和布局
[manager]
# 显示隐藏文件（以点开头的文件）
show_hidden = true

# 排序方式: "alphabetical" | "mtime" | "natural" | "size" | "created"
sort_by = "mtime"

# 反向排序（降序）
sort_reverse = true

# 行显示模式: "none" | "size" | "mtime" | "permissions" | "owner" | "git"
linemode = "mtime"

# 三栏布局比例 [父目录, 当前目录, 预览]
# 1:3:4 表示预览窗口占最大比例
ratio = [1, 3, 4]

# -----------------------------------------------------------------------------
# [preview] - 预览面板设置
# -----------------------------------------------------------------------------
# 控制文件预览的显示方式和性能
[preview]
# 文本换行: "no" | "wrap" | "character"
wrap = "no"

# Tab 显示宽度（空格数）
tab_size = 2

# 图片预览最大尺寸（像素）
max_width = 1200
max_height = 1800

# 预览缓存目录（空字符串使用默认临时目录）
cache_dir = ""

# 图片加载延迟（毫秒），避免快速切换时加载过多图片
image_delay = 10

# 图片缩放滤镜: "nearest" | "triangle" | "catmull-rom" | "gaussian" | "lanczos3"
image_filter = "triangle"

# 图片质量 (1-100)
image_quality = 90

# Ueberzugpp 缩放比例
ueberzug_scale = 1

# Ueberzugpp 边距 [x, y, w, h]
ueberzug_offset = [0, 0, 0, 0]

# -----------------------------------------------------------------------------
# [tasks] - 后台任务设置
# -----------------------------------------------------------------------------
# 控制文件操作（复制、移动等）的并发性能
[tasks]
# 微任务工作线程数（处理小文件）
micro_workers = 10

# 宏任务工作线程数（处理大文件）
macro_workers = 10

# 失败重试次数
bizarre_retry = 3

# 图片任务内存分配 (0 = 自动)
image_alloc = 0

# 图片任务边界 [宽度, 高度] (0 = 无限制)
image_bound = [0, 0]

# 禁用预加载（影响预览速度但减少内存占用）
suppress_preload = false

# -----------------------------------------------------------------------------
# [opener] - 文件打开器定义
# -----------------------------------------------------------------------------
# 定义打开文件的方式（编辑器、系统程序等）
[opener]
# 编辑器 - 按 e 键调用
edit = [
  { run = "nvim \"$@\"", desc = "Neovim" },
]

# 系统默认打开 - 按 Enter 键调用
open = [
  { run = "open \"$@\"", desc = "macOS Open" },
]

# -----------------------------------------------------------------------------
# [open] - 文件打开规则
# -----------------------------------------------------------------------------
# 根据文件名/MIME 类型匹配打开器
# 规则优先级：prepend_rules > 内置规则 > append_rules
[open]
# 在内置规则之前插入（优先级更高）
prepend_rules = [
  # iWork 套件文件 - 使用系统默认打开
  { name = "*.pages", use = "open" },    # Pages 文档
  { name = "*.numbers", use = "open" },  # Numbers 表格
  { name = "*.key", use = "open" },      # Keynote 演示

  # ZIP 压缩包使用系统默认打开
  { mime = "application/zip", use = "open" },
]

# -----------------------------------------------------------------------------
# [plugin] - 插件设置
# -----------------------------------------------------------------------------
# 扩展预览器和预加载器
[plugin]
# 预览器（在前插入，优先级高）
prepend_previewers = [
  # HEIC/HEIF 格式图片预览（苹果设备拍摄的照片格式）
  { mime = "image/heic", run = "heic-ql" },
]

# 预加载器（在前插入，优先级高）
prepend_preloaders = [
  # HEIC 插件通过 previewers 处理，无需额外 preloader
]

