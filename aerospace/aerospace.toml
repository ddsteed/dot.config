# =========================================================
# AeroSpace Minimalist Config
# i3-style | Alt-based | Rectangle-friendly
# =========================================================

# ---------------------------------------------------------
# 1. 基础设置 (General Settings)
# ---------------------------------------------------------
start-at-login = true

# 类似于 i3 的平铺逻辑
enable-normalization-flatten-containers = false
enable-normalization-opposite-orientation-for-nested-containers = false

# 默认布局：Tiles (平铺)
default-root-container-layout = 'tiles'

# 窗口间距 (简约风格)
[gaps]
inner.horizontal = 4
inner.vertical =   4
outer.left =       4
outer.bottom =     4
outer.top =        4
outer.right =      4

# ---------------------------------------------------------
# 2. 窗口规则 (Window Rules)
# ---------------------------------------------------------

# === 强制浮动 (Floating) ===
# 微信、腾讯会议、Finder、系统设置 -> 浮动模式
# 这些窗口可以使用 Rectangle 进行管理
[[on-window-detected]]
if.app-id = 'com.tencent.xinWeChat'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.tencent.meeting'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

# === 应用分组优化 (App Grouping) ===

# Workspace 1: Coding (Emacs, iTerm2)
[[on-window-detected]]
if.app-id = 'org.gnu.Emacs'
run = 'move-node-to-workspace 1'

[[on-window-detected]]
if.app-id = 'com.googlecode.iterm2'
run = 'move-node-to-workspace 1'

# Workspace 2: Browsing (Safari, Chrome)
[[on-window-detected]]
if.app-id = 'com.apple.Safari'
run = 'move-node-to-workspace 1'

[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = 'move-node-to-workspace 2'

# Workspace 3: Reading (Calibre, WeChat Reading)
[[on-window-detected]]
if.app-id = 'net.kovidgoyal.calibre'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
# 微信读书 (Mac App Store 版通常 ID 如下，如不同请通过 `aerospace list-apps` 查看)
if.app-name-regex-substring = 'Weread'
run = 'move-node-to-workspace 3'

# ---------------------------------------------------------
# 3. 快捷键定义 (Keybindings)
# ---------------------------------------------------------
[mode.main.binding]

# === 核心操作 ===
# 打开终端 (需要你已安装 iTerm2)
alt-enter = 'exec-and-forget open -a iTerm2'

# 关闭当前聚焦的窗口
alt-q = 'close'

# 切换平铺/浮动模式 (i3 习惯: Alt+Shift+Space)
# 浮动后即可配合 Rectangle 使用
alt-shift-space = 'layout floating tiling'

# 重新加载配置
alt-shift-c = 'reload-config'

# === 焦点移动 (i3 风格: Alt + h/j/k/l) ===
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# === 窗口移动 (Alt + Shift + h/j/k/l) ===
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# === 调整窗口大小 (Ctrl + Alt + h/j/k/l) ===
# 这样不需要进入 Resize 模式，直接调整
ctrl-alt-h = 'resize width -50'
ctrl-alt-j = 'resize height +50'
ctrl-alt-k = 'resize height -50'
ctrl-alt-l = 'resize width +50'

# === 工作区切换 (Alt + 1~4) ===
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'

# === 移动窗口到工作区 (Alt + Shift + 1~4) ===
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'

# === 布局调整 ===
# 旋转布局 (横向/纵向切换)
alt-e = 'layout tiles horizontal vertical'

# 均衡分割 (让所有窗口大小一致)
alt-equal = 'balance-sizes'
