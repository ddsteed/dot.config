# =========================================================
# AeroSpace Minimalist Config
# i3-style | Alt-based | Rectangle-friendly
# =========================================================

# ---------------------------------------------------------
# 1. 基础设置 (General Settings)
# ---------------------------------------------------------
start-at-login = true

# 类似于 i3 的平铺逻辑
enable-normalization-flatten-containers = false
enable-normalization-opposite-orientation-for-nested-containers = false

# 默认布局：Tiles (平铺)
default-root-container-layout = 'tiles'

# === SketchyBar 联动配置 ===
# 启动时加载 SketchyBar
after-startup-command = [
    'exec-and-forget sketchybar'
]

# 切换工作区时通知 SketchyBar
exec-on-workspace-change = [
    '/bin/bash', '-c',
    'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]

# ---------------------------------------------------------
# 2. 窗口间距 (Gaps) - 修复报错版
# ---------------------------------------------------------
# 注意：由于你的 AeroSpace 版本暂不支持 [[gaps]] 数组语法，
# 这里回滚到标准 [gaps] 表格语法。
# ---------------------------------------------------------
# 1. 针对笔记本内置屏幕 (MacBook)
# 逻辑：系统会自动避让刘海，所以这里不需要留 SketchyBar 的高度
# 只需要留一点点缝隙 (4px) 保持美观即可
# [[gaps]]
# monitor = 'built-in'
# inner.horizontal = 2
# inner.vertical =   2
# outer.left =       1
# outer.bottom =     1
# outer.top = 30       4   # <--- 笔记本只要一点点缝隙
# outer.right =      1

# 2. 针对所有其他屏幕 (外接显示器)
# 逻辑：外接屏没有刘海，需要手动留出 SketchyBar 的位置 (33px)
[gaps]
#monitor = 'all'
inner.horizontal = 2
inner.vertical = 2
outer.left = 1
outer.bottom = 1
outer.top = 30
outer.right = 1

# ---------------------------------------------------------
# 3. 窗口规则 (Window Rules)
# ---------------------------------------------------------

# === 强制浮动 (Floating) ===
[[on-window-detected]]
if.app-id = 'com.tencent.xinWeChat'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.tencent.meeting'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.mail'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.DanPristupov.Fork'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'io.github.clash-verge-rev.clash-verge-rev'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'org.pqrs.Karabiner-Elements.Settings'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.superultra.Homerow'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.ranchero.NetNewsWire-Evergreen'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'org.zotero.zotero'
run = ['layout floating', 'move-node-to-workspace 4']

# === 应用分组优化 (App Grouping) ===

# Workspace 1: Coding (Emacs, iTerm2, Safari)
[[on-window-detected]]
if.app-id = 'org.gnu.Emacs'
run = 'move-node-to-workspace 1'

[[on-window-detected]]
if.app-id = 'com.googlecode.iterm2'
run = 'move-node-to-workspace 1'

[[on-window-detected]]
if.app-id = 'com.apple.Safari'
run = 'move-node-to-workspace 1'

# Workspace 2: Browsing (Chrome)
[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = 'move-node-to-workspace 2'

# Workspace 3: Reading
[[on-window-detected]]
if.app-id = 'net.kovidgoyal.calibre'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'com.tencent.weread'
run = 'move-node-to-workspace 3'

# Workspace 4: News / Tools
[[on-window-detected]]
if.app-id = 'company.thebrowser.Browser'
run = 'move-node-to-workspace 4'

[[on-window-detected]]
if.app-id = 'io.github.clash-verge-rev.clash-verge-rev'
run = 'move-node-to-workspace 4'

# === SketchyBar 联动 (检测所有窗口变化) ===
[[on-window-detected]]
if.app-id = '.*'
run = 'exec-and-forget sketchybar --trigger aerospace_workspace_change'

# ---------------------------------------------------------
# 4. 快捷键定义 (Keybindings)
# ---------------------------------------------------------
[mode.main.binding]

# === 核心操作 ===
alt-shift-n = 'move-node-to-monitor next'
alt-shift-p = 'move-node-to-monitor prev'
alt-n = 'focus-monitor next'
alt-p = 'focus-monitor prev'

# 全屏
shift-alt-enter = 'fullscreen'

# 关闭
alt-q = 'close'

# 浮动/平铺切换
alt-shift-space = 'layout floating tiling'

# 重载配置
alt-shift-c = 'reload-config'

# === 焦点移动 ===
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# === 窗口移动 ===
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# === 调整大小 ===
ctrl-alt-h = 'resize width -50'
ctrl-alt-j = 'resize height +50'
ctrl-alt-k = 'resize height -50'
ctrl-alt-l = 'resize width +50'

# === 工作区切换 ===
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'

# === 移动窗口到工作区 ===
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'

# === 布局 ===
alt-e = 'layout tiles horizontal vertical'
alt-equal = 'balance-sizes'
